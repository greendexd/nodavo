[package]
name = "nodavo-platform-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Windows input, display, session, and clipboard boundary for Nodavo"
publish = false

[features]
windows-ui-auth-development = []
windows-ui-auth-release = []

[dependencies]
nodavo-input = { path = "../nodavo-input" }
nodavo-protocol = { path = "../nodavo-protocol" }
nodavo-update = { path = "../nodavo-update" }
thiserror.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
tokio.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

[target.'cfg(target_os = "windows")'.dev-dependencies]
nodavo-transfer = { path = "../nodavo-transfer" }

[lints]
workspace = true
