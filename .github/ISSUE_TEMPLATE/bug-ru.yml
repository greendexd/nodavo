name: Сообщение об ошибке (Русский)
description: Сообщите о воспроизводимой проблеме Nodavo, включая pre-alpha планирование.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо. Не прикладывайте секреты, настоящее содержимое буфера, частные имена файлов, pairing codes и неочищенные логи. Об уязвимостях сообщайте через Private Vulnerability Reporting.
  - type: input
    id: version
    attributes:
      label: Версия или commit
      description: На этапе планирования поле необязательно; после появления кода укажите SHA коммита.
      placeholder: v0.0.0, SHA коммита или не применимо
  - type: dropdown
    id: direction
    attributes:
      label: Направление
      options:
        - macOS → Windows
        - Windows → macOS
        - Оба направления
        - Документация или планирование
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: Версии ОС, CPU, экраны, тип сети и выданные permissions.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Область
      multiple: true
      options:
        - Discovery и pairing
        - Мышь или trackpad
        - Клавиатура или раскладка
        - Clipboard
        - Файлы
        - Permissions
        - Installer или update
        - Документация
        - Другое
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Шаги воспроизведения
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Очищенная диагностика
      description: Опционально. Удалите личные пути, IP, имена файлов и содержимое.
      render: text
  - type: checkboxes
    id: confirmations
    attributes:
      label: Подтверждение
      options:
        - label: Я проверил существующие issues.
          required: true
        - label: Я удалил секреты и частные данные.
          required: true
        - label: Это не сообщение об уязвимости.
          required: true
