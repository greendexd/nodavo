name: Repository checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  repository:
    name: Documentation and repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate bilingual docs and local links
        run: python3 .github/scripts/check_docs.py
      - name: Validate Rust workspace metadata
        run: cargo metadata --format-version 1 --no-deps
      - name: Keep supervisor reducer APIs out of the agent build
        run: |
          check_agent_feature_tree() {
            feature_tree=$(cargo tree --locked -e features -p nodavo-agent "$@") || {
              echo "could not inspect nodavo-agent feature tree: $*" >&2
              exit 1
            }
            if grep -F 'nodavo-update feature "supervisor-host"' <<<"$feature_tree"; then
              echo "nodavo-agent enabled the supervisor-only update reducer feature: $*" >&2
              exit 1
            fi
          }
          check_agent_feature_tree --no-default-features --target aarch64-apple-darwin
          check_agent_feature_tree --no-default-features --target x86_64-apple-darwin
          check_agent_feature_tree --no-default-features \
            --features development-unverified-local-ipc \
            --target aarch64-apple-darwin
          check_agent_feature_tree --no-default-features \
            --features development-unverified-local-ipc \
            --target x86_64-apple-darwin
          check_agent_feature_tree --no-default-features \
            --features windows-ui-auth-development \
            --target x86_64-pc-windows-msvc
          check_agent_feature_tree --no-default-features \
            --features windows-ui-auth-development \
            --target aarch64-pc-windows-msvc
          check_agent_feature_tree --no-default-features \
            --features windows-ui-auth-release \
            --target x86_64-pc-windows-msvc
          check_agent_feature_tree --no-default-features \
            --features windows-ui-auth-release \
            --target aarch64-pc-windows-msvc
      - name: Verify DCO sign-offs
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for commit in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            author=$(git show -s --format='%an <%ae>' "$commit")
            if ! git show -s --format=%B "$commit" | grep -Fxi "Signed-off-by: $author"; then
              echo "Missing matching DCO sign-off: $commit ($author)"
              failed=1
            fi
          done
          exit "$failed"

  rust-macos:
    name: Rust formatting and macOS check
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install the repository Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check the Rust workspace on macOS
        run: cargo check --workspace --locked
      - name: Test both updater trust-boundary feature sets
        run: |
          cargo test -p nodavo-update --locked
          cargo test -p nodavo-update --locked --features supervisor-host

  swift-macos:
    name: Swift packages on macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build the macOS application shell
        run: swift build --package-path apps/macos
      - name: Build the macOS feasibility programs
        run: |
          swift build --package-path spikes/macos-input
          swift build --package-path spikes/macos-clipboard

  rust-windows-x64:
    name: Rust check on Windows x64
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install the repository Rust toolchain
        shell: pwsh
        run: rustup toolchain install stable --profile minimal
      - name: Check the Rust workspace for Windows x64
        run: cargo check --workspace --locked --target x86_64-pc-windows-msvc
      - name: Run Windows local IPC policy and ordinary-process rejection tests
        shell: pwsh
        env:
          NODAVO_WINDOWS_AUTH_SIGNER_CERT_SHA256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          cargo test -p nodavo-platform-windows --locked --target x86_64-pc-windows-msvc
          cargo test -p nodavo-platform-windows --locked `
            --target x86_64-pc-windows-msvc `
            --no-default-features `
            --features windows-ui-auth-development `
            private_pipe_rejects_an_unpackaged_current_process
      - name: Install .NET 8 for the WinUI shell
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Run Windows product and lifecycle static checks
        run: python apps/windows/tests/check_product_ui.py
      - name: Run Windows agent auth policy, lifecycle, race, and timeout tests
        run: dotnet run --project apps/windows/tests/Nodavo.Windows.Lifecycle.Tests/Nodavo.Windows.Lifecycle.Tests.csproj --configuration Release
      - name: Restore Windows App SDK packages
        run: dotnet restore apps/windows/Nodavo.Windows.sln -p:Platform=x64
      - name: Compile the WinUI 3 shell for Windows x64
        run: dotnet build apps/windows/Nodavo.Windows.sln --no-restore --configuration Release -p:Platform=x64

# Feature, fuzz, stress, security, upgrade, and release matrices intentionally
# remain separate 1.0 gates. This workflow only proves that the pre-alpha
# foundation still formats and compiles; it does not qualify a release.
