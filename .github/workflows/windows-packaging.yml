name: Windows development packaging

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/windows/**"
      - "crates/nodavo-agent/**"
      - "crates/nodavo-platform-windows/**"
      - "scripts/package-windows.ps1"
      - ".github/workflows/windows-packaging.yml"
      - "Cargo.lock"
      - "Cargo.toml"
  push:
    branches: [main, "codex/**"]
    paths:
      - "apps/windows/**"
      - "crates/nodavo-agent/**"
      - "crates/nodavo-platform-windows/**"
      - "scripts/package-windows.ps1"
      - ".github/workflows/windows-packaging.yml"
      - "Cargo.lock"
      - "Cargo.toml"

permissions:
  contents: read

jobs:
  package-development:
    name: Self-signed x64 and ARM64 MSIX bundle
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the repository Rust toolchain
        shell: pwsh
        run: rustup toolchain install stable --profile minimal

      - name: Install .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Run agent auth policy, lifecycle, race, timeout, and manifest checks
        shell: pwsh
        run: |
          python apps/windows/tests/check_product_ui.py
          dotnet run --project apps/windows/tests/Nodavo.Windows.Lifecycle.Tests/Nodavo.Windows.Lifecycle.Tests.csproj --configuration Release

      - name: Build and verify the development MSIX bundle
        shell: pwsh
        run: |
          $buildNumber = [int64]$env:GITHUB_RUN_NUMBER % 65535
          if ($buildNumber -eq 0) { $buildNumber = 1 }
          ./scripts/package-windows.ps1 `
            -Development `
            -Version 0.1.0 `
            -BuildNumber $buildNumber

      - name: Install and inspect the exact development package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoots = @(Get-ChildItem -LiteralPath target/windows-packages `
              -Directory | Where-Object Name -Like '*-development')
          if ($artifactRoots.Count -ne 1) {
              throw "Expected exactly one development artifact root."
          }
          $artifactRoot = $artifactRoots[0].FullName
          $bundles = @(Get-ChildItem -LiteralPath $artifactRoot `
              -Filter '*-DEVELOPMENT-NOT-FOR-DISTRIBUTION.msixbundle' -File)
          $certificates = @(Get-ChildItem -LiteralPath $artifactRoot `
              -Filter 'Nodavo-DEVELOPMENT-NOT-FOR-DISTRIBUTION.cer' -File)
          $metadataFiles = @(Get-ChildItem -LiteralPath $artifactRoot `
              -Filter 'package-metadata.json' -File)
          if ($bundles.Count -ne 1 -or $certificates.Count -ne 1 -or
              $metadataFiles.Count -ne 1) {
              throw "Development package evidence is incomplete or ambiguous."
          }
          $metadata = Get-Content -LiteralPath $metadataFiles[0].FullName -Raw |
              ConvertFrom-Json
          if ($metadata.mode -cne 'development' -or
              $metadata.packageIdentityName -cne 'dev.nodavo.Nodavo.Development' -or
              $metadata.publisher -cne 'CN=Nodavo Development Only') {
              throw "Development package metadata has an unexpected identity."
          }
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $certificates[0].FullName)
          $primaryError = $null
          try {
              $thumbprint = $certificate.Thumbprint
          }
          finally {
              $certificate.Dispose()
          }
          if ([string]::IsNullOrWhiteSpace($thumbprint) -or
              $thumbprint -cne $metadata.signerThumbprint) {
              throw "Development certificate does not match package metadata."
          }
          $trustedCertificatePath =
              "Cert:\LocalMachine\TrustedPeople\$thumbprint"
          if (Test-Path -LiteralPath $trustedCertificatePath) {
              throw "Exact development certificate was already trusted before the smoke."
          }
          $preinstalled = @(Get-AppxPackage -Name $metadata.packageIdentityName)
          if ($preinstalled.Count -ne 0) {
              throw "Exact development package was already installed before the smoke."
          }

          try {
              $imported = Import-Certificate `
                  -FilePath $certificates[0].FullName `
                  -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople'
              if ($imported.Thumbprint -cne $thumbprint -or
                  -not (Test-Path -LiteralPath $trustedCertificatePath)) {
                  throw "Exact public development certificate was not trusted."
              }
              Add-AppxPackage -Path $bundles[0].FullName
              $packages = @(Get-AppxPackage -Name $metadata.packageIdentityName)
              if ($packages.Count -ne 1) {
                  throw "Expected exactly one installed development package."
              }
              $package = $packages[0]
              if ($package.Publisher -cne $metadata.publisher -or
                  $package.PackageFamilyName -cne $metadata.packageFamilyName -or
                  ([string]$package.Version) -cne $metadata.packageVersion -or
                  ([string]$package.Architecture) -cne 'X64') {
                  throw "Installed package identity/version/architecture mismatch."
              }
              $manifest = Get-AppxPackageManifest -Package $package.PackageFullName
              $namespaces = [Xml.XmlNamespaceManager]::new($manifest.NameTable)
              $namespaces.AddNamespace(
                  'foundation',
                  'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
              $namespaces.AddNamespace(
                  'desktop',
                  'http://schemas.microsoft.com/appx/manifest/desktop/windows10')
              $applications = @($manifest.SelectNodes(
                  '/foundation:Package/foundation:Applications/foundation:Application',
                  $namespaces))
              if ($applications.Count -ne 1 -or
                  $applications[0].GetAttribute('Id') -cne 'App' -or
                  $applications[0].GetAttribute('Executable') -cne
                      $metadata.executable) {
                  throw "Installed application manifest entry mismatch."
              }
              $extensions = @($applications[0].SelectNodes(
                  'foundation:Extensions/desktop:Extension', $namespaces))
              if ($extensions.Count -ne 1 -or
                  $extensions[0].GetAttribute('Category') -cne
                      'windows.startupTask' -or
                  $extensions[0].GetAttribute('Executable') -cne
                      $metadata.agentExecutable -or
                  $extensions[0].GetAttribute('EntryPoint') -cne
                      'Windows.FullTrustApplication') {
                  throw "Installed StartupTask declaration mismatch."
              }
              $startupTasks = @($extensions[0].SelectNodes(
                  'desktop:StartupTask', $namespaces))
              if ($startupTasks.Count -ne 1 -or
                  $startupTasks[0].GetAttribute('TaskId') -cne
                      $metadata.startupTaskId -or
                  $startupTasks[0].GetAttribute('Enabled') -cne 'false') {
                  throw "Installed StartupTask policy mismatch."
              }
              $agent = Join-Path $package.InstallLocation $metadata.agentExecutable
              if (-not (Test-Path -LiteralPath $agent -PathType Leaf)) {
                  throw "Installed package does not contain the exact agent executable."
              }
              $selfCheckRoot = Join-Path $env:RUNNER_TEMP (
                  "nodavo-installed-self-check-" + [Guid]::NewGuid().ToString('N'))
              $null = New-Item -ItemType Directory -Path $selfCheckRoot
              $selfCheckScript = Join-Path $selfCheckRoot 'invoke.ps1'
              $selfCheckRequest = Join-Path $selfCheckRoot 'request.json'
              $selfCheckOutputPath = Join-Path $selfCheckRoot 'stdout.txt'
              $selfCheckErrorPath = Join-Path $selfCheckRoot 'stderr.txt'
              $selfCheckExitPath = Join-Path $selfCheckRoot 'exit.txt'
              $selfCheckDonePath = Join-Path $selfCheckRoot 'done.txt'
              $selfCheckPidPath = Join-Path $selfCheckRoot 'pid.txt'
              @'
          param([Parameter(Mandatory = $true)][string]$RequestPath)
          $ErrorActionPreference = 'Stop'
          $request = Get-Content -LiteralPath $RequestPath -Raw | ConvertFrom-Json
          $wrapperProcess = Get-Process -Id $PID
          [IO.File]::WriteAllText(
              $request.pidPath,
              "$PID`:$($wrapperProcess.StartTime.ToUniversalTime().Ticks)")
          $process = $null
          try {
              $process = Start-Process `
                  -FilePath $request.agentPath `
                  -ArgumentList '--self-check' `
                  -WorkingDirectory (Split-Path -Parent $request.agentPath) `
                  -RedirectStandardOutput $request.outputPath `
                  -RedirectStandardError $request.errorPath `
                  -NoNewWindow `
                  -PassThru
              if (-not $process.WaitForExit(10000)) {
                  $process.Kill($true)
                  if (-not $process.WaitForExit(5000)) {
                      throw 'stop failed'
                  }
                  [IO.File]::WriteAllText($request.exitPath, '124')
              } else {
                  [IO.File]::WriteAllText(
                      $request.exitPath,
                      [string]$process.ExitCode)
              }
          }
          catch {
              [IO.File]::WriteAllText($request.exitPath, '125')
          }
          finally {
              if ($null -ne $process) {
                  try {
                      if (-not $process.HasExited) {
                          $process.Kill($true)
                          $null = $process.WaitForExit(5000)
                      }
                  }
                  finally {
                      $process.Dispose()
                  }
              }
          }
          [IO.File]::WriteAllText($request.donePath, 'done')
          '@ | Set-Content -LiteralPath $selfCheckScript -Encoding utf8NoBOM
              @{
                  agentPath = $agent
                  outputPath = $selfCheckOutputPath
                  errorPath = $selfCheckErrorPath
                  exitPath = $selfCheckExitPath
                  donePath = $selfCheckDonePath
                  pidPath = $selfCheckPidPath
              } | ConvertTo-Json -Compress |
                  Set-Content -LiteralPath $selfCheckRequest -Encoding utf8NoBOM
              foreach ($generatedPath in @(
                  $selfCheckScript, $selfCheckRequest, $agent)) {
                  if ($generatedPath.Contains('"')) {
                      throw "Installed self-check path cannot be quoted safely."
                  }
              }
              $runnerPowerShell = [Environment]::ProcessPath
              $resolveExactWrapper = {
                  param([string]$PidPath, [string]$ExpectedExecutable)
                  if (-not (Test-Path -LiteralPath $PidPath)) {
                      return $null
                  }
                  $pidParts = (Get-Content -LiteralPath $PidPath -Raw).Split(':')
                  if ($pidParts.Count -ne 2 -or
                      $pidParts[0] -notmatch '^[1-9][0-9]*$' -or
                      $pidParts[1] -notmatch '^[1-9][0-9]*$') {
                      throw "Installed self-check wrapper identity is malformed."
                  }
                  $candidate = Get-Process -Id ([int]$pidParts[0]) `
                      -ErrorAction SilentlyContinue
                  if ($null -eq $candidate) {
                      return $null
                  }
                  try {
                      if ($candidate.Path -cne $ExpectedExecutable -or
                          $candidate.StartTime.ToUniversalTime().Ticks -ne
                              [long]$pidParts[1]) {
                          throw "Installed self-check wrapper identity changed."
                      }
                  }
                  catch [System.InvalidOperationException] {
                      return $null
                  }
                  return $candidate
              }
              $selfCheckArguments =
                  "-NoLogo -NoProfile -NonInteractive -File `"$selfCheckScript`" " +
                  "-RequestPath `"$selfCheckRequest`""
              Invoke-CommandInDesktopPackage `
                  -PackageFamilyName $package.PackageFamilyName `
                  -AppId $applications[0].GetAttribute('Id') `
                  -Command $runnerPowerShell `
                  -Args $selfCheckArguments `
                  -PreventBreakaway `
                  -ErrorAction Stop
              $selfCheckDeadline = [DateTime]::UtcNow.AddSeconds(20)
              while (-not (Test-Path -LiteralPath $selfCheckDonePath) -and
                  [DateTime]::UtcNow -lt $selfCheckDeadline) {
                  Start-Sleep -Milliseconds 100
              }
              if (-not (Test-Path -LiteralPath $selfCheckDonePath)) {
                  $staleWrapper = & $resolveExactWrapper `
                      $selfCheckPidPath $runnerPowerShell
                  if ($null -ne $staleWrapper) {
                      try {
                          $staleWrapper.Kill($true)
                          if (-not $staleWrapper.WaitForExit(5000)) {
                              throw "Installed self-check wrapper could not be stopped."
                          }
                      }
                      finally {
                          $staleWrapper.Dispose()
                      }
                  }
                  throw "Installed agent self-check timed out."
              }
              if (-not (Test-Path -LiteralPath $selfCheckPidPath)) {
                  throw "Installed self-check wrapper identity is missing."
              }
              $completedWrapper = & $resolveExactWrapper `
                  $selfCheckPidPath $runnerPowerShell
              if ($null -ne $completedWrapper) {
                  try {
                      if (-not $completedWrapper.WaitForExit(5000)) {
                          $completedWrapper.Kill($true)
                          if (-not $completedWrapper.WaitForExit(5000)) {
                              throw "Installed self-check wrapper could not be stopped."
                          }
                          throw "Installed self-check wrapper did not exit cleanly."
                      }
                  }
                  finally {
                      $completedWrapper.Dispose()
                  }
              }
              $selfCheckExit = Get-Content -LiteralPath $selfCheckExitPath -Raw
              $selfCheckOutputInfo = Get-Item -LiteralPath $selfCheckOutputPath `
                  -ErrorAction SilentlyContinue
              $selfCheckErrorInfo = Get-Item -LiteralPath $selfCheckErrorPath `
                  -ErrorAction SilentlyContinue
              if ($null -eq $selfCheckOutputInfo -or
                  $selfCheckOutputInfo.Length -gt 256 -or
                  $null -eq $selfCheckErrorInfo -or
                  $selfCheckErrorInfo.Length -ne 0) {
                  throw "Installed agent self-check output was missing or oversized."
              }
              $selfCheckOutput = [IO.File]::ReadAllText($selfCheckOutputPath)
              $expectedSelfCheck =
                  'nodavo-agent: core runtime available; windows-ui-auth=development'
              if ($selfCheckExit -cne '0' -or
                  ($selfCheckOutput -cne "$expectedSelfCheck`n" -and
                      $selfCheckOutput -cne "$expectedSelfCheck`r`n")) {
                  throw "Installed agent self-check failed."
              }
          }
          catch {
              $primaryError = $_
          }
          finally {
              $cleanupErrors = [Collections.Generic.List[string]]::new()
              try {
                  if ($null -ne $selfCheckRoot -and
                      (Test-Path -LiteralPath $selfCheckRoot)) {
                      Remove-Item -LiteralPath $selfCheckRoot -Recurse -Force `
                          -ErrorAction Stop
                  }
              }
              catch {
                  $cleanupErrors.Add('installed self-check evidence removal failed')
              }
              try {
                  $installedPackages = @(
                      Get-AppxPackage -Name $metadata.packageIdentityName
                  )
                  foreach ($installedPackage in $installedPackages) {
                      Remove-AppxPackage `
                          -Package $installedPackage.PackageFullName `
                          -ErrorAction Stop
                  }
              }
              catch {
                  $cleanupErrors.Add('installed package removal failed')
              }
              try {
                  if (@(Get-AppxPackage -Name $metadata.packageIdentityName).Count -ne 0) {
                      $cleanupErrors.Add('exact development package remains installed')
                  }
              }
              catch {
                  $cleanupErrors.Add('installed package cleanup could not be verified')
              }
              try {
                  if (Test-Path -LiteralPath $trustedCertificatePath) {
                      Remove-Item -LiteralPath $trustedCertificatePath -Force -ErrorAction Stop
                  }
              }
              catch {
                  $cleanupErrors.Add('trusted certificate removal failed')
              }
              try {
                  if (Test-Path -LiteralPath $trustedCertificatePath) {
                      $cleanupErrors.Add('exact development certificate remains trusted')
                  }
              }
              catch {
                  $cleanupErrors.Add('trusted certificate cleanup could not be verified')
              }
              if ($cleanupErrors.Count -ne 0) {
                  if ($null -ne $primaryError) {
                      throw "Installed-package smoke failed: $($primaryError.Exception.Message) Cleanup failed: $($cleanupErrors -join '; ')."
                  }
                  throw "Installed-package smoke cleanup failed: $($cleanupErrors -join '; ')."
              }
          }
          if ($null -ne $primaryError) {
              throw $primaryError
          }

      - name: Upload development-only package evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nodavo-windows-development-not-for-distribution
          path: target/windows-packages/*-development/**
          if-no-files-found: error
          retention-days: 7

# This workflow intentionally cannot produce a release. The release path in
# scripts/package-windows.ps1 is fail-closed and requires an identity-validated
# Authenticode certificate plus an RFC 3161 timestamp service. Store submission,
# release signing, and clean-machine qualification are separate 1.0 gates.
