<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Nodavo logo</title>
  <desc id="desc">Two connected computer displays with a cursor moving between them.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111936"/>
      <stop offset="1" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="accent" x1="88" y1="90" x2="430" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.52" stop-color="#5b7cfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)"/>
  <path d="M199 181 C256 181 249 331 313 331" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>

  <rect x="80" y="98" width="178" height="132" rx="28" fill="#0d1430" stroke="url(#accent)" stroke-width="13"/>
  <path d="M131 256h76M169 230v26" stroke="#a6b7ff" stroke-width="12" stroke-linecap="round"/>

  <rect x="254" y="282" width="178" height="132" rx="28" fill="#0d1430" stroke="url(#accent)" stroke-width="13"/>
  <path d="M305 440h76M343 414v26" stroke="#70e7f4" stroke-width="12" stroke-linecap="round"/>

  <path d="M239 218l75 45-34 10 17 38-24 11-17-39-27 21z" fill="#f8fafc" stroke="#111936" stroke-width="7" stroke-linejoin="round"/>
</svg>

